# Codecov turns coverage into two required checks on every pull request:
#
#   codecov/project  the whole repository must not drop below the floor
#   codecov/patch    the lines this PR adds or changes must be covered
#
# The floor matches the one mix enforces locally (coveralls.json), so a PR fails the
# same way on a laptop and in CI.
codecov:
  require_ci_to_pass: true
  notify:
    # Report once the unit job has uploaded; the other jobs produce no coverage.
    after_n_builds: 1

coverage:
  precision: 1
  round: down
  range: "85...95"
  status:
    project:
      default:
        target: 90%
        # A refactor that moves a few covered lines around should not fail the build.
        threshold: 0.5%
        if_ci_failed: error
    patch:
      default:
        # New code carries its own tests. Dropping below this is how coverage rots.
        target: 85%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "condensed_header, diff, flags, components, condensed_files"
  behavior: default
  require_changes: false

ignore:
  - "test/**/*"
  - "loadtest/**/*"
  - "website/**/*"
  - "examples/**/*"
  - "priv/**/*"
  - "lib/arc_web/components/core_components.ex"  # generated by the Phoenix installer
  - "lib/arc_web/gettext.ex"
  - "lib/arc_web/telemetry.ex"

# Named parts of the system, so a PR comment says where coverage moved.
component_management:
  individual_components:
    - component_id: data_plane
      name: Data plane
      paths: ["lib/arc/realtime/**", "lib/arc/presence.ex", "lib/arc/channels/**"]
    - component_id: crypto_auth
      name: Crypto and auth
      paths: ["lib/arc/crypto*/**", "lib/arc/crypto.ex", "lib/arc_web/plugs/api_auth.ex", "lib/arc_web/admin_auth.ex"]
    - component_id: api
      name: HTTP API
      paths: ["lib/arc_web/controllers/api/**", "lib/arc/events.ex"]
    - component_id: webhooks
      name: Webhooks
      paths: ["lib/arc/webhooks/**", "lib/arc/webhooks.ex"]
    - component_id: dashboard
      name: Dashboard
      paths: ["lib/arc_web/live/**", "lib/arc_web/controllers/admin/**", "lib/arc_web/components/**"]
