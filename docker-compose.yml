# Local stack: Arc + Postgres + Keycloak, pre-configured, plus a Next.js demo app.
#
#   docker compose up --build
#
# Then open http://localhost:4000 (dashboard, sign in as admin / admin) and
# http://localhost:3000 (the demo; open it in two windows).
#
# Keycloak is addressed as http://keycloak.localhost:8180 by both the browser and the
# Arc container (browsers resolve *.localhost to 127.0.0.1; inside the compose network
# the name is an alias of the Keycloak container), so the token issuer matches on both
# sides. If your browser does not resolve *.localhost, add
# "127.0.0.1 keycloak.localhost" to /etc/hosts.
#
# Postgres is published on 5442 so `mix test` and `mix phx.server` can use it too.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
      POSTGRES_DB: arc
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  # One-shot: applies migrations and makes sure the demo app exists (with an
  # encryption key and a webhook pointing at the demo), then writes its credentials
  # to a volume the demo reads. Runs before Arc starts, so Arc's cache warms with it.
  arc-seed:
    image: arc:local
    build: .
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment: &arc-env
      DATABASE_URL: postgres://arc:arc@postgres:5432/arc
      # Development-only keys. Generate real ones with `mix arc.gen.keys`.
      SECRET_KEY_BASE: dev-only-secret-key-base-change-me-dev-only-secret-key-base-change-me-00
      ARC_ENCRYPTION_KEY: ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
      PHX_HOST: localhost
      PHX_PUBLIC_PORT: "4000"
      PHX_PUBLIC_SCHEME: http
      PORT: "4000"
      ARC_OIDC_ISSUER: http://keycloak.localhost:8180/realms/arc
      ARC_OIDC_CLIENT_ID: arc-dashboard
      ARC_OIDC_CLIENT_SECRET: arc-dashboard-dev-secret
      ARC_ADMIN_EMAILS: admin@example.com
      # /metrics is public without this; the stack sets one so scraping is the same
      # shape as production.
      ARC_METRICS_AUTH_TOKEN: dev-only-metrics-token
    volumes:
      - demo-credentials:/shared
    command:
      - sh
      - -c
      - >-
        /app/bin/migrate &&
        /app/bin/arc eval 'Arc.Release.write_app_credentials("/shared/arc-demo.json",
        %{"name" => "Next.js demo", "client_events_enabled" => true},
        encryption: true,
        webhook: %{"url" => "http://demo:3000/api/webhooks",
        "events" => ["channel_occupied", "channel_vacated", "member_added", "member_removed", "cache_miss"]})'

  arc:
    image: arc:local
    build: .
    depends_on:
      arc-seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment: *arc-env
    # Longer than ARC_DRAIN_SECONDS (default 5) plus closing connections, so a
    # `docker compose stop` drains instead of being killed mid-drain.
    stop_grace_period: 30s
    ports:
      - "4000:4000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  demo:
    build: examples/nextjs-demo
    depends_on:
      arc:
        condition: service_healthy
    environment:
      ARC_CREDENTIALS_FILE: /shared/arc-demo.json
      # Server-to-server calls go over the compose network...
      ARC_API_HOST: arc
      ARC_API_PORT: "4000"
      # ...while browsers connect to the published port.
      ARC_WS_HOST: localhost
      ARC_WS_PORT: "4000"
    volumes:
      - demo-credentials:/shared:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
  demo-credentials:
