apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc
  namespace: arc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: arc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: arc
    spec:
      # Must exceed ARC_DRAIN_SECONDS plus time to close connections and flush webhooks.
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: arc
      containers:
        - name: arc
          image: kryptonhq/arc:0.1.0
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: arc-config
            - secretRef:
                name: arc-secrets
          env:
            - name: RELEASE_NODE
              value: "arc@$(POD_IP)"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
