name: Publish image

# Builds the Arc release image and pushes it to Docker Hub as
# kryptonhq/arc:<tag>. Triggered by a version tag (v1.2.3 -> :1.2.3 and :latest)
# or manually with a tag of your choice.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  a Docker Hub account with push access to kryptonhq/arc
#   DOCKERHUB_TOKEN     an access token for that account (Docker Hub > Account
#                       settings > Personal access tokens), not the password
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, e.g. 1.2.3 or edge"
        required: true
        type: string
      latest:
        description: "Also update the latest tag"
        required: false
        default: false
        type: boolean

env:
  IMAGE: kryptonhq/arc

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            latest=true
          else
            version="${{ inputs.tag }}"
            latest="${{ inputs.latest }}"
          fi
          tags="$IMAGE:$version"
          if [ "$latest" = "true" ]; then tags="$tags,$IMAGE:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # amd64 builds natively; arm64 is emulated, which is slower but keeps the
      # image usable on Apple silicon and Graviton.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Arc
            org.opencontainers.image.description=Self-hosted realtime messaging server speaking the Channels protocol v7
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: The published image starts and reports ready
        run: |
          docker network create arc-check
          docker run -d --name pg --network arc-check \
            -e POSTGRES_USER=arc -e POSTGRES_PASSWORD=arc -e POSTGRES_DB=arc postgres:16
          for _ in $(seq 1 30); do docker exec pg pg_isready -U arc && break; sleep 2; done
          docker run -d --name arc --network arc-check -p 4000:4000 \
            -e DATABASE_URL=postgres://arc:arc@pg:5432/arc \
            -e SECRET_KEY_BASE=$(head -c 48 /dev/urandom | base64 | tr -d '\n' | head -c 64) \
            -e ARC_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64) \
            -e PHX_HOST=localhost -e PHX_PUBLIC_PORT=4000 -e PHX_PUBLIC_SCHEME=http \
            -e ARC_OIDC_ISSUER=http://localhost:8180/realms/arc \
            -e ARC_OIDC_CLIENT_ID=arc-dashboard -e ARC_OIDC_CLIENT_SECRET=unused \
            -e ARC_ADMIN_EMAILS=admin@example.com \
            "$IMAGE:${{ steps.tags.outputs.version }}"
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { docker logs arc; exit 1; }

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.tags.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
