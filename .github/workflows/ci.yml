name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "27.3"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      docs: ${{ steps.filter.outputs.docs }}
      demo: ${{ steps.filter.outputs.demo }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'lib/**'
              - 'test/**'
              - 'config/**'
              - 'priv/**'
              - 'mix.exs'
              - 'mix.lock'
              - 'coveralls.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'website/**'
              - '.github/workflows/ci.yml'
            demo:
              - 'examples/nextjs-demo/**'
              - '.github/workflows/ci.yml'
            packaging:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker/**'
              - 'rel/**'
              - 'lib/**'
              - 'config/**'
              - 'mix.exs'
              - 'mix.lock'
              - 'examples/nextjs-demo/**'
              - '.github/workflows/ci.yml'
  test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: Unit, property, protocol, failure
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # Runs the suite with coverage: fails below the floor in coveralls.json and
      # writes cover/cobertura.xml for Codecov.
      - run: mix coveralls.cobertura
      - name: Critical modules at 100%
        run: |
          mix coveralls.json > /dev/null
          python3 - <<'PY'
          import json, sys
          required = ["lib/arc/crypto.ex", "lib/arc/crypto/secret_box.ex", "lib/arc/channels/auth.ex",
                      "lib/arc/channels/channel.ex", "lib/arc_web/plugs/api_auth.ex", "lib/arc_web/admin_auth.ex",
                      "lib/arc/realtime/protocol.ex", "lib/arc/realtime/socket.ex", "lib/arc/realtime/error_codes.ex"]
          report = {f["name"]: f for f in json.load(open("cover/excoveralls.json"))["source_files"]}
          bad = False
          for name in required:
              source = report[name]["source"].split("\n")
              missed = [i + 1 for i, c in enumerate(report[name]["coverage"]) if c == 0]
              if missed:
                  bad = True
                  print(f"{name} is not fully covered:")
                  for line in missed:
                      print(f"  {name}:{line}: {source[line - 1].strip()}")
          if bad:
              sys.exit("the modules above must stay at 100% line coverage")
          PY

      - name: Send coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/cobertura.xml
          flags: unit
          # A gate nobody can see is not a gate: a failed upload fails the job.
          fail_ci_if_error: true

  cluster:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: Cluster (three nodes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - run: mix test.cluster

  integration:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.demo == 'true'
    name: Real SDKs (JavaScript client, Python server)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mix deps.get
      - run: test/integration/run.sh

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only pull requests: the action compares a PR's dependencies against the base.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Arc ships under Apache-2.0, so a dependency that would force the whole
          # work open has to be a deliberate decision, not a silent upgrade.
          deny-licenses: GPL-1.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0, Elastic-2.0
          comment-summary-in-pr: on-failure
          fail-on-severity: high

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Documentation site builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  stack:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    name: Compose stack boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: The dashboard, health and metrics endpoints answer
        run: |
          set -e
          curl -fsS http://localhost:4000/health/live > /dev/null
          curl -fsS http://localhost:4000/health/ready > /dev/null
          curl -fsS http://localhost:4000/metrics | grep -q arc_connections_active
          # The seeded demo app exists and the Next.js demo renders against it.
          curl -fsS http://localhost:3000/ | grep -q "Arc demo"
          # Unauthenticated dashboard requests start the OIDC flow.
          curl -fsS -o /dev/null -w '%{http_code}' http://localhost:4000/admin | grep -q 302
      - if: failure()
        run: docker compose logs
